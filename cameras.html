<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cameras</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #wall {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 4px;
    height: 100%;
  }
  .tile {
    position: relative;
    background: #111;
    overflow: hidden;
    cursor: zoom-in;
  }
  .tile video-stream, .tile img {
    width: 100%;
    height: 100%;
    border: 0;
    object-fit: contain;
    display: block;
    pointer-events: none; /* let clicks reach the tile */
  }
  .tile video { object-fit: contain; }
  /* Hide go2rtc's "MSE"/"RTC" mode badge (its error text, top-left, still shows) */
  .tile video-stream .mode { display: none; }
  /* One camera enlarged to fill the screen */
  #wall.single { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #wall.single .tile { display: none; cursor: zoom-out; }
  #wall.single .tile.active { display: block; }

  /* Stack vertically on narrow phone screens */
  @media (max-width: 600px) and (orientation: portrait) {
    html, body { overflow: auto; }
    #wall { grid-template-columns: 1fr; grid-template-rows: none; height: auto; }
    .tile { aspect-ratio: 16 / 9; }
  }
</style>
</head>
<body>
<div id="wall"></div>

<script src="config.js"></script>
<script src="cameras.js"></script>
</body>
</html>
